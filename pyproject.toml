[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "noise-filter"
version = "0.1.0"
description = "Enhance voice audio with preset noise reduction profiles (CLI + TUI)"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "toml>=0.10.2",
    "textual>=0.41.0",
    "platformdirs>=3.0",
]

[project.scripts]
noise-filter = "noise_filter.cli:main"

[tool.setuptools.packages.find]
include = ["noise_filter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
